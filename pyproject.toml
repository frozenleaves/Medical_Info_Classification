[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-image-classification"
version = "1.0.0"
authors = [
    {name = "frozenleaves", email = "example@example.com"},
]
description = "多模态医学信息分类"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "torch>=2.7.1",
    "torchvision>=0.22.1", 
    "transformers>=4.57.1",
    "timm>=0.9.0",
    "scikit-learn>=1.3.0",
    "numpy==1.26.4",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "albumentations>=1.3.0",
    "tqdm>=4.65.0",
    "Pillow>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
    "pre-commit>=3.0.0",
]
visualization = [
    "plotly>=5.0.0",
    "dash>=2.0.0",
]
wsi = [
    "openslide-python>=1.2.0",
]
wandb = [
    "wandb>=0.15.0",
]

[project.urls]
Homepage = "https://github.com/your-org/medical-image-classification"
Documentation = "https://medical-image-classification.readthedocs.io"
Repository = "https://github.com/your-org/medical-image-classification.git"
"Bug Tracker" = "https://github.com/your-org/medical-image-classification/issues"

[project.scripts]
mic-train = "MIC.src.main:main"
mic-inference = "MIC.src.inference:main"

[tool.setuptools]
packages = ["MIC", "MIC.src"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml", "*.txt"]

# Black配置
[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # 默认排除的目录
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

# isort配置
[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["MIC"]
known_third_party = [
    "torch",
    "torchvision", 
    "transformers",
    "timm",
    "sklearn",
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "albumentations",
    "tqdm",
    "PIL",
]

# pytest配置
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require GPU",
    "integration: marks tests as integration tests",
]

# Coverage配置
[tool.coverage.run]
source = ["MIC"]
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
